name: Dependency repair

on:
  push:
    branches:
      - portfolio-improvements-2026-08
    paths:
      - .github/workflows/dependency-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Repair lockfile within declared semver ranges
        run: npm audit fix --package-lock-only
      - name: Ensure package manifest was not rewritten
        run: git diff --exit-code -- package.json
      - name: Verify production high/critical audit
        run: npm audit --omit=dev --audit-level=high
      - name: Commit audited lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "No lockfile changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: refresh audited dependencies [skip ci]"
          git push origin HEAD:${GITHUB_REF_NAME}
